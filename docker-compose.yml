version: "3.8"

services:
  homebox-vision-importer:
    build: .
    container_name: homebox-vision-importer
    ports:
      - "8082:8000"  # Expose on port 8082 to avoid conflicts with other homelab apps
    restart: unless-stopped
    environment:
      - HOMEBOX_URL=http://your-homebox-ip:7745
      - HOMEBOX_API_KEY=hb_your_api_key_here
      # AI Api Keys (provide at least one)
      - GEMINI_API_KEY=your_gemini_api_key_here
      - ANTHROPIC_API_KEY=your_anthropic_api_key_here
      # Default AI Provider ('gemini' or 'claude')
      - LLM_PROVIDER=gemini
      # Optional model names
      - GEMINI_MODEL=gemini-1.5-flash
      - CLAUDE_MODEL=claude-3-5-sonnet-20240620
