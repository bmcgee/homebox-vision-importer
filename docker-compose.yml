name: homebox-vision-importer

services:
  homebox-vision-importer:
    build: .
    container_name: homebox-vision-importer
    network_mode: "host"
    restart: unless-stopped
    volumes:
      - homebox_importer_data:/data
    environment:
      HOMEBOX_URL: "http://127.0.0.1:7745"
      HOMEBOX_API_KEY: "your_homebox_api_key_here"
      GEMINI_API_KEY: "your_gemini_api_key_here"
      ANTHROPIC_API_KEY: "your_anthropic_api_key_here"
      LLM_PROVIDER: "gemini"
      GEMINI_MODEL: "gemini-3.6-flash"
      CLAUDE_MODEL: "claude-3-5-sonnet-20240620"

volumes:
  homebox_importer_data:
